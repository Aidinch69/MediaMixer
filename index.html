<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Mixer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">Media Mixer</div>
  <div class="controls">
    <label>Tiles
      <select id="tileCount">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3" selected>3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
      </select>
    </label>
    <label>Image secs
      <input type="number" id="imgDuration" min="2" max="300" value="8">
    </label>
    <button id="toggleBinaural">Binaural Beat</button>
  </div>
</header>

<div id="binauralPanel" class="panel hidden">
  <h3>Binaural Beat</h3>
  <label>Carrier Hz <input type="range" id="carrierFreq" min="100" max="400" value="200"><span id="carrierVal">200</span></label>
  <label>Beat Hz <input type="range" id="beatFreq" min="1" max="40" value="6"><span id="beatVal">6</span></label>
  <div class="presets">
    <button type="button" data-beat="2">Delta 2Hz</button>
    <button type="button" data-beat="6">Theta 6Hz</button>
    <button type="button" data-beat="10">Alpha 10Hz</button>
    <button type="button" data-beat="20">Beta 20Hz</button>
  </div>
  <label>Volume <input type="range" id="beatVolume" min="0" max="1" step="0.01" value="0.2"></label>
  <button type="button" id="beatToggle">Play</button>
  <p class="hint">Use headphones — binaural effect requires two ears.</p>
</div>

<main id="grid"></main>

<script src="app.js"></script>
</body>
</html>
